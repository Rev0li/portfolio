name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check-test-build:
    name: Types, tests & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - name: Types (svelte-check)
        run: npm run check
      - name: Tests (vitest)
        run: npm test
      - name: Build
        run: npm run build

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t portfolio .
