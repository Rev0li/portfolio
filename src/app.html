<!doctype html>
<html lang="fr">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<link rel="icon" href="https://cdn.jsdelivr.net/gh/Rev0li/MyCss@v1.3.0/assets/favicon.svg" type="image/svg+xml" />
		<!-- MyCss (version figée, alignée sur $lib/mycss) : tokens, base de page, composants, favicon -->
		<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/Rev0li/MyCss@v1.3.0/dist/rv-tokens.css" />
		<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/Rev0li/MyCss@v1.3.0/dist/rv-base.css" />
		<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/Rev0li/MyCss@v1.3.0/dist/rv-components.css" />
		<!-- Thème choisi par le visiteur, appliqué avant l'affichage (pas de flash) -->
		<script>
			try {
				const t = localStorage.getItem('rv-theme');
				if (t === 'dark' || t === 'light') document.documentElement.dataset.theme = t;
			} catch {}
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
