services:
  portfolio:
    build: .
    image: portfolio-rev0li
    container_name: portfolio-rev0li
    restart: unless-stopped
    ports:
      - "49154:3000"
    read_only: true
    # Réglages du serveur (LIVE_SERVICES du bandeau live) : voir .env.example
    env_file: .env
    environment:
      # Derrière le Caddy du VPS : vraie adresse publique du site
      ORIGIN: https://portfolio.rev0li.duckdns.org
